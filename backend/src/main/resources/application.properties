spring.application.name=CarnetEchange
server.port=${PORT:8080}

# Datasource : défini par RenderDatabaseEnvironmentPostProcessor (DATABASE_URL / PGHOST)
# ou par le profil `dev` (H2). Ne pas forcer un driver ici : ça provoquait localhost:5432 sur Render.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=5

# JWT — obligatoire en production : secret Base64 (256 bits minimum)
security.jwt.token.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

app.welcome-stamps=1
app.delivery-fee=1000
app.library-deposit=5000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:/tmp/carnet-uploads}

# CORS — URLs frontend séparées par des virgules
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://carnet-echange-web.onrender.com}
