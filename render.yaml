# Render Blueprint — Carnet d'Échange
# Déployer : Render Dashboard → New → Blueprint → connecter le repo Git

databases:
  - name: carnet-db
    plan: free
    databaseName: carnetechange
    user: carnet

services:
  # ─── API Spring Boot ───
  - type: web
    name: carnet-echange-api
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/carnet-echange-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/v1/health
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: DATABASE_URL
        fromDatabase:
          name: carnet-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/carnet-uploads

  # ─── Frontend React (Static Site) ───
  - type: web
    name: carnet-echange-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
