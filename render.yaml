# Render Blueprint — Carnet d'Échange
# Déployer : Render Dashboard → Blueprint → Sync (ou New → Blueprint)

databases:
  - name: carnet-db
    plan: free
    databaseName: carnetechange
    user: carnet

services:
  # ─── API Spring Boot ───
  - type: web
    name: carnet-echange-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carnet-db
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: carnet-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: carnet-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: carnet-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: carnet-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: carnet-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://carnet-echange-web.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/carnet-uploads

  # ─── Frontend React ───
  - type: web
    name: carnet-echange-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://carnet-echange-api.onrender.com/api/v1
