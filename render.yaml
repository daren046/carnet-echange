# Render Blueprint — Carnet d'Échange
# Déployer : Render Dashboard → New → Blueprint → connecter le repo Git

databases:
  - name: carnet-db
    plan: free
    databaseName: carnetechange
    user: carnet

services:
  # ─── API Spring Boot (Docker) ───
  - type: web
    name: carnet-echange-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carnet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://carnet-echange-web.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/carnet-uploads

  # ─── Frontend React (Static Site — pas de champ plan, toujours gratuit) ───
  - type: web
    name: carnet-echange-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://carnet-echange-api.onrender.com/api/v1
